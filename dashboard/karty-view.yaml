# Widok "Karty" — wklej w edytorze dashboardu (Edytuj dashboard → ⋮ → Edytor YAML, sekcja views)
title: Karty
path: karty
icon: mdi:card-account-details-outline
type: panel
cards:
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    triggers_update: ["sensor.karty_loga"]
    styles:
      card:
        - padding: 16px
        - pointer-events: auto
        - cursor: default
      grid:
        - grid-template-areas: '"karty"'
        - grid-template-columns: 100%
      custom_fields:
        karty:
          - width: 100%
    custom_fields:
      karty: |-
        [[[
        const KT = {};
        KT.sha1 = bytes => {
          const rotl = (x, n) => (x << n) | (x >>> (32 - n));
          const ml = bytes.length * 8;
          const withPad = new Uint8Array(((bytes.length + 9 + 63) >> 6) << 6);
          withPad.set(bytes); withPad[bytes.length] = 0x80;
          const dv = new DataView(withPad.buffer);
          dv.setUint32(withPad.length - 4, ml >>> 0); dv.setUint32(withPad.length - 8, Math.floor(ml / 2 ** 32));
          let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
          const w = new Uint32Array(80);
          for (let i = 0; i < withPad.length; i += 64) {
            for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
            for (let t = 16; t < 80; t++) w[t] = rotl(w[t - 3] ^ w[t - 8] ^ w[t - 14] ^ w[t - 16], 1);
            let a = h0, b = h1, c = h2, d = h3, e = h4;
            for (let t = 0; t < 80; t++) {
              const f = t < 20 ? (b & c) | (~b & d) : t < 40 ? b ^ c ^ d : t < 60 ? (b & c) | (b & d) | (c & d) : b ^ c ^ d;
              const k = t < 20 ? 0x5A827999 : t < 40 ? 0x6ED9EBA1 : t < 60 ? 0x8F1BBCDC : 0xCA62C1D6;
              const tmp = (rotl(a, 5) + f + e + k + w[t]) >>> 0;
              e = d; d = c; c = rotl(b, 30) >>> 0; b = a; a = tmp;
            }
            h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
          }
          const out = new Uint8Array(20); const o = new DataView(out.buffer);
          [h0, h1, h2, h3, h4].forEach((h, i) => o.setUint32(i * 4, h));
          return out;
        };
        KT.hmac = (key, msg) => {
          if (key.length > 64) key = KT.sha1(key);
          const k = new Uint8Array(64); k.set(key);
          const ip = k.map(b => b ^ 0x36), op = k.map(b => b ^ 0x5c);
          const inner = new Uint8Array(64 + msg.length); inner.set(ip); inner.set(msg, 64);
          const ih = KT.sha1(inner);
          const outer = new Uint8Array(84); outer.set(op); outer.set(ih, 64);
          return KT.sha1(outer);
        };
        KT.base32 = s => {
          const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
          const clean = String(s || '').toUpperCase().replace(/[\s=-]/g, '');
          let bits = 0, val = 0; const out = [];
          for (const ch of clean) {
            const i = A.indexOf(ch); if (i < 0) throw new Error('Nieprawidłowy sekret (Base32)');
            val = (val << 5) | i; bits += 5;
            if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; }
          }
          return new Uint8Array(out);
        };
        KT.totp = (secret, period, digits, nowMs) => {
          const counter = Math.floor((nowMs ?? Date.now()) / 1000 / period);
          const msg = new Uint8Array(8); const dv = new DataView(msg.buffer);
          dv.setUint32(0, Math.floor(counter / 2 ** 32)); dv.setUint32(4, counter >>> 0);
          const h = KT.hmac(KT.base32(secret), msg);
          const off = h[19] & 15;
          const bin = ((h[off] & 127) << 24) | (h[off + 1] << 16) | (h[off + 2] << 8) | h[off + 3];
          return String(bin % 10 ** digits).padStart(digits, '0');
        };

        const root = this.shadowRoot;
        const uid = 'k' + Math.random().toString(36).slice(2, 8);
        const KEY = 'karty_lojalnosciowe';
        const LIB = '/local/karty/';
        // telefony z aplikacją HA: model (z User-Agent aplikacji) -> usługa notify (sterowanie jasnością)
        // Uzupełnij własnymi telefonami, np. { 'SM-A576B': 'mobile_app_moj_telefon' }
        // (model z User-Agent aplikacji HA -> usługa notify). Pusta mapa = bez rozjaśniania ekranu.
        const DEV = {};
        const TYPES = { auto: 'Kod kreskowy', ean13: 'EAN-13', ean8: 'EAN-8', code128: 'Code 128', qr: 'Kod QR', totp: 'Kod dynamiczny', app: 'Otwórz aplikację' };
        const COLORS = ['#00843d', '#e30613', '#0050aa', '#ffcc00', '#f39200', '#7b2d8e', '#1d1d1b', '#00a0e3'];
        const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const logoKey = n => String(n || '').replace(/ł/g, 'l').replace(/Ł/g, 'L').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '');
        const splitName = n => {
          const m = String(n || '').match(/^(.*?)(?:\s+[-–—]\s*|\s*[-–—]\s+|\s*\()(.+?)\)?\s*$/);
          return m ? [m[1].trim(), m[2].trim()] : [String(n || '').trim(), ''];
        };
        const logoOf = c => {
          if (c.nologo) return '';
          const l = (states['sensor.karty_loga'] || { attributes: {} }).attributes.logos || {};
          return l[logoKey(splitName(c.name)[0])] || '';
        };
        const textOn = hex => { const n = parseInt((hex || '#555').slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 160 ? '#111' : '#fff'; };

        const cardPhoto = file => new Promise((ok, bad) => {
          const url = URL.createObjectURL(file);
          const im = new Image();
          im.onload = () => {
            const W = 640, H = Math.round(640 / 1.586), r = W / H;
            let sw = im.naturalWidth, sh = im.naturalHeight, sx = 0, sy = 0;
            if (sw / sh > r) { sx = (sw - sh * r) / 2; sw = sh * r; } else { sy = (sh - sw / r) / 2; sh = sw / r; }
            const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
            cv.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, W, H);
            URL.revokeObjectURL(url);
            ok(cv.toDataURL('image/jpeg', 0.75));
          };
          im.onerror = () => { URL.revokeObjectURL(url); bad(new Error('Nie udało się wczytać zdjęcia')); };
          im.src = url;
        });
        const libs = () => window.__kartyLibs || (window.__kartyLibs = Promise.all(['JsBarcode.all.min.js', 'qrcode.js'].map(f => new Promise((ok, bad) => {
          const s = document.createElement('script'); s.src = LIB + f; s.onload = ok; s.onerror = () => bad(new Error('Nie wczytano ' + f));
          document.head.appendChild(s);
        }))));
        // Wspólny magazyn: integracja custom_components/karty (karty/get|set, zapis dla każdego użytkownika).
        // Dopóki integracja nie działa (przed restartem HA), fallback na frontend system_data (zapis tylko admin).
        let shared = false;
        const load = async () => {
          try {
            const r = await hass.connection.sendMessagePromise({ type: 'karty/get' });
            shared = true;
            return (r && r.value && r.value.cards) || [];
          } catch (e) { shared = false; }
          try {
            const r = await hass.connection.sendMessagePromise({ type: 'frontend/get_system_data', key: KEY });
            if (r && r.value && r.value.cards) return r.value.cards;
            // Jednorazowa migracja: wspólny magazyn pusty -> przenieś prywatne karty admina, który otworzy widok.
            if (hass.user && hass.user.is_admin) {
              const u = await hass.connection.sendMessagePromise({ type: 'frontend/get_user_data', key: KEY });
              const own = (u && u.value && u.value.cards) || [];
              if (own.length) await save(own);
              return own;
            }
            return [];
          }
          catch (e) { return []; }
        };
        const save = cards => shared
          ? hass.connection.sendMessagePromise({ type: 'karty/set', value: { cards } })
          : hass.connection.sendMessagePromise({ type: 'frontend/set_system_data', key: KEY, value: { cards } });

        const brightness = on => {
          const ua = navigator.userAgent;
          if (!ua.includes('Home Assistant/')) return;
          const hit = Object.entries(DEV).find(([m]) => ua.includes(m));
          if (!hit) return;
          const send = (message, command) => hass.callService('notify', hit[1], { message, data: { command } }).catch(() => {});
          if (on) { send('command_auto_screen_brightness', 'turn_off'); send('command_screen_brightness_level', 255); }
          else send('command_auto_screen_brightness', 'turn_on');
        };

        const renderCode = (box, content, fmt) => {
          box.innerHTML = '';
          if (fmt === 'qr') {
            const q = qrcode(0, 'M'); q.addData(content); q.make();
            box.innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
            const s = box.querySelector('svg'); s.style.width = 'min(80vw, 58vh)'; s.style.height = 'auto';
            return;
          }
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          box.appendChild(svg);
          let f = fmt === 'ean13' ? 'EAN13' : fmt === 'ean8' ? 'EAN8' : 'CODE128';
          if (fmt === 'auto') f = /^\d{13}$/.test(content) ? 'EAN13' : /^\d{8}$/.test(content) ? 'EAN8' : 'CODE128';
          const opt = { displayValue: false, width: 3, height: 160, margin: 18, background: '#ffffff', lineColor: '#000000' };
          try { JsBarcode(svg, content, { ...opt, format: f }); } catch (e) { JsBarcode(svg, content, { ...opt, format: 'CODE128' }); }
          const w = parseFloat(svg.getAttribute('width')), h = parseFloat(svg.getAttribute('height'));
          svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.removeAttribute('width'); svg.removeAttribute('height');
          svg.style.width = 'min(94vw, 900px)'; svg.style.height = 'auto'; svg.style.maxHeight = '50vh';
        };

        const openApp = c => {
          const pkg = (c.app || '').trim();
          if (navigator.userAgent.includes('Home Assistant/')) window.open('app://' + pkg, '_blank');
          else window.open('https://play.google.com/store/apps/details?id=' + encodeURIComponent(pkg), '_blank');
        };
        const openFull = async c => {
          try { await libs(); } catch (e) { alert(e.message); return; }
          document.getElementById('karty-full')?.remove();
          const ov = document.createElement('div');
          ov.id = 'karty-full';
          const fg = textOn(c.color);
          ov.innerHTML = `<style>
        #karty-full { position: fixed; inset: 0; z-index: 30; background: #fff; color: #111; display: flex; flex-direction: column;
          font-family: var(--ha-font-family-body, Roboto, sans-serif); }
        #karty-full .bar { display: flex; align-items: center; gap: 12px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
          background: ${c.color}; color: ${fg}; }
        #karty-full .back { border: 0; background: rgba(0,0,0,.18); color: inherit; font-size: 16px; font-weight: 600; border-radius: 22px;
          padding: 10px 18px; cursor: pointer; }
        #karty-full .nm { font-size: 20px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #karty-full .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; }
        #karty-full .num { font: 600 24px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .14em; text-align: center; word-break: break-all; }
        #karty-full .tm { width: min(80vw, 420px); text-align: center; font-size: 14px; color: #444; }
        #karty-full .tm .track { height: 8px; border-radius: 4px; background: #e5e5e5; overflow: hidden; margin-top: 6px; }
        #karty-full .tm .fill { height: 100%; background: ${c.color}; transition: width 1s linear; }
        #karty-full .note { margin: 0 12px 12px; margin-bottom: max(12px, env(safe-area-inset-bottom)); padding: 12px 16px; border-radius: 12px;
          background: #f3f3f3; border-left: 5px solid ${c.color}; color: #222; font-size: 17px; line-height: 1.35; white-space: normal; }
        #karty-full .err { color: #c62828; text-align: center; padding: 24px; }
        </style>
        <div class="bar"><button class="back">← Wróć</button><div class="nm">${esc(c.name)}</div></div>
        <div class="body"><div class="code"></div><div class="num"></div><div class="tm"></div></div>
        ${c.note ? `<div class="note">${esc(c.note).replace(/\n/g, '<br>')}</div>` : ''}`;
          document.body.appendChild(ov);
          const box = ov.querySelector('.code'), num = ov.querySelector('.num'), tm = ov.querySelector('.tm');
          let timer = null, lock = null, step = null;
          const paint = () => {
            try {
              if (c.type === 'totp') {
                const t = c.totp || {};
                const period = +t.period || 120, digits = +t.digits || 6;
                const now = Date.now(), s = Math.floor(now / 1000 / period);
                if (s !== step) {
                  step = s;
                  const code = KT.totp(t.secret, period, digits, now);
                  const content = (t.template || '{kod}').split('{kod}').join(code);
                  renderCode(box, content, t.fmt || 'qr');
                  num.textContent = (t.template || '{kod}') === '{kod}' ? code : '';
                }
                const left = Math.ceil(period - (now / 1000) % period);
                tm.innerHTML = `Nowy kod za ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}
                  <div class="track"><div class="fill" style="width:${(left / period) * 100}%"></div></div>`;
              } else {
                renderCode(box, c.code, c.type);
                num.textContent = c.type === 'qr' && c.code.length > 24 ? '' : c.code;
              }
            } catch (e) {
              box.innerHTML = `<div class="err">Nie da się wygenerować kodu: ${esc(e.message || e)}</div>`;
            }
          };
          paint();
          if (c.type === 'totp') timer = setInterval(paint, 1000);
          const onKey = e => { if (e.key === 'Escape' && !document.fullscreenElement) close(); };
          const onPop = () => close(true);
          const close = fromPop => {
            clearInterval(timer);
            window.removeEventListener('popstate', onPop);
            document.removeEventListener('keydown', onKey, true);
            try { lock && lock.release(); } catch (e) {}
            try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
            ov.remove();
            brightness(false);
            if (!fromPop) history.back();
          };
          history.pushState({ karty: 1 }, '');
          window.addEventListener('popstate', onPop);
          document.addEventListener('keydown', onKey, true);
          ov.querySelector('.back').addEventListener('click', () => close());
          try { await ov.requestFullscreen?.({ navigationUI: 'hide' }); } catch (e) {}
          try { lock = await navigator.wakeLock?.request('screen'); } catch (e) {}
          brightness(true);
        };

        const openForm = async (cards, idx) => {
          document.getElementById('karty-form')?.remove();
          const c = idx == null ? { name: '', code: '', type: 'auto', color: COLORS[0], totp: { period: 120, digits: 6, template: '{kod}', fmt: 'qr' } }
            : JSON.parse(JSON.stringify(cards[idx]));
          c.totp = Object.assign({ period: 120, digits: 6, template: '{kod}', fmt: 'qr', secret: '' }, c.totp || {});
          const canScan = 'BarcodeDetector' in window && !!navigator.mediaDevices?.getUserMedia && window.isSecureContext;
          const f = document.createElement('div');
          f.id = 'karty-form';
          f.innerHTML = `<style>
        #karty-form { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center;
          font-family: var(--ha-font-family-body, Roboto, sans-serif); color: var(--primary-text-color); }
        #karty-form .box { background: var(--card-background-color, #fff); border-radius: 16px; width: min(460px, calc(100vw - 24px));
          max-height: calc(100vh - 32px); overflow: auto; padding: 18px 20px; box-sizing: border-box; box-shadow: 0 8px 32px rgba(0,0,0,.35); }
        #karty-form h2 { margin: 0 0 12px; font-size: 20px; font-weight: 500; }
        #karty-form label { display: block; font-size: 13px; color: var(--secondary-text-color); margin: 12px 0 4px; }
        #karty-form input, #karty-form select, #karty-form textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; font-size: 16px;
          border: 1px solid var(--divider-color); background: var(--secondary-background-color); color: var(--primary-text-color); }
        #karty-form textarea { resize: vertical; font-family: inherit; }
        #karty-form .row { display: flex; gap: 8px; align-items: center; }
        #karty-form .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex: none; }
        #karty-form .sw.on { border-color: var(--primary-text-color); }
        #karty-form .hint { font-size: 12px; color: var(--secondary-text-color); margin-top: 4px; }
        #karty-form .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
        #karty-form button.b { border: 0; border-radius: 18px; padding: 9px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
          background: none; color: var(--primary-color); }
        #karty-form button.pri { background: var(--primary-color); color: var(--text-primary-color, #fff); }
        #karty-form button.del { color: var(--error-color); margin-right: auto; }
        #karty-form .scan { width: 100%; margin-top: 8px; border: 1px dashed var(--primary-color); }
        #karty-form video { width: 100%; border-radius: 10px; margin-top: 8px; background: #000; }
        #karty-form .photo img { width: 100%; aspect-ratio: 1.586; object-fit: cover; border-radius: 12px; display: block; margin-bottom: 8px; }
        #karty-form .totp, #karty-form .app { display: none; } #karty-form.is-totp .totp, #karty-form.is-app .app { display: block; }
        #karty-form.is-totp .static, #karty-form.is-app .static { display: none; }
        </style>
        <div class="box">
          <h2>${idx == null ? 'Nowa karta' : 'Edytuj kartę'}</h2>
          <label>Nazwa sklepu</label><input name="name" value="${esc(c.name)}" placeholder="np. Biedronka">
          <div class="hint">Masz dwie karty jednego sklepu? Dopisz po myślniku, np. <b>Makro – firmowa</b> (logo zostaje Makro).</div>
          <label>Rodzaj kodu</label><select name="type">${Object.entries(TYPES).map(([k, v]) =>
            `<option value="${k}" ${c.type === k ? 'selected' : ''}>${v}${k === 'auto' ? ' (rozpoznaj automatycznie)' : k === 'totp' ? ' (zmienia się co kilka minut)' : k === 'app' ? ' (np. Żappka – kod pokaże aplikacja sklepu)' : ''}</option>`).join('')}</select>
          <div class="static">
            <label>Numer karty / zawartość kodu</label><input name="code" value="${esc(c.code)}" inputmode="text" placeholder="np. 2900123456789">
            ${canScan ? '<button class="b scan" data-act="scan">📷 Zeskanuj kod z karty aparatem</button><div class="cam"></div>' : ''}
          </div>
          <div class="app">
            <label>Aplikacja sklepu (nazwa pakietu Androida)</label><input name="app" value="${esc(c.app || '')}" placeholder="np. pl.zabka.apb2c" autocomplete="off">
            <div class="row" style="margin-top:8px"><button class="b" data-act="zappka" style="border:1px dashed var(--primary-color)">Żappka</button></div>
            <div class="hint">Nazwę pakietu znajdziesz w adresie aplikacji w Sklepie Play: …/details?id=<b>nazwa.pakietu</b>. Działa w aplikacji Home Assistant na Androidzie.</div>
          </div>
          <div class="totp">
            <label>Sekret (Base32)</label><input name="secret" value="${esc(c.totp.secret)}" placeholder="np. JBSWY3DPEHPK3PXP" autocomplete="off">
            <div class="row">
              <div style="flex:1"><label>Zmiana co (s)</label><input name="period" type="number" min="10" value="${esc(c.totp.period)}"></div>
              <div style="flex:1"><label>Cyfry</label><input name="digits" type="number" min="4" max="10" value="${esc(c.totp.digits)}"></div>
              <div style="flex:1"><label>Format</label><select name="fmt"><option value="qr" ${c.totp.fmt === 'qr' ? 'selected' : ''}>QR</option>
                <option value="code128" ${c.totp.fmt === 'code128' ? 'selected' : ''}>Kreskowy</option></select></div>
            </div>
            <label>Zawartość kodu</label><input name="template" value="${esc(c.totp.template)}">
            <div class="hint">{kod} zostanie zastąpione aktualnym kodem jednorazowym, np. <code>NUMER-KARTY-{kod}</code>.</div>
          </div>
          <label class="row" style="gap:10px;color:var(--primary-text-color);font-size:14px;cursor:pointer">
            <input name="uselogo" type="checkbox" ${c.nologo ? '' : 'checked'} style="width:20px;height:20px;flex:none"> Pokaż logo sklepu (pobierane automatycznie z internetu)</label>
          <div class="logo-prev"></div>
          <label>Strona sklepu (opcjonalnie – pomaga znaleźć logo)</label><input name="domain" value="${esc(c.domain || '')}" placeholder="np. hebe.pl" autocomplete="off">
          <label>Komentarz (pokaże się na dole przy kodzie)</label>
          <textarea name="note" rows="2" placeholder="np. karta na numer Kamili, zbieraj punkty za paliwo">${esc(c.note || '')}</textarea>
          <label>Zdjęcie karty (zamiast koloru)</label>
          <div class="photo"></div>
          <div class="row">
            <label class="b pick" style="margin:0;flex:1;text-align:center;border:1px dashed var(--primary-color);border-radius:18px;padding:9px;color:var(--primary-color);cursor:pointer">
              📷 Zrób zdjęcie / wybierz<input name="file" type="file" accept="image/*" style="display:none"></label>
            <button class="b" data-act="nophoto" style="display:none">Usuń zdjęcie</button>
          </div>
          <div class="hint">Zdjęcie przodu karty z logo – zostanie przycięte do proporcji karty.</div>
          <label>Kolor karty</label>
          <div class="row">${COLORS.map(col => `<div class="sw ${col === c.color ? 'on' : ''}" data-col="${col}" style="background:${col}"></div>`).join('')}
            <input name="color" type="color" value="${esc(c.color)}" style="width:44px;height:34px;padding:2px;flex:none"></div>
          <div class="btns">
            ${idx == null ? '' : '<button class="b del" data-act="del">Usuń kartę</button>'}
            <button class="b" data-act="cancel">Anuluj</button><button class="b pri" data-act="save">Zapisz</button>
          </div>
        </div>`;
          document.body.appendChild(f);
          const $ = n => f.querySelector(`[name="${n}"]`);
          let img = c.img || '';
          const showPhoto = () => {
            f.querySelector('.photo').innerHTML = img ? `<img src="${img}" alt="">` : '';
            f.querySelector('[data-act="nophoto"]').style.display = img ? '' : 'none';
          };
          showPhoto();
          const lp = logoOf(c);
          if (lp) f.querySelector('.logo-prev').innerHTML = `<img src="${lp}" alt="" style="max-height:48px;max-width:60%;margin:6px 0;background:#fff;border-radius:6px;padding:4px">`;
          $('file').addEventListener('change', async () => {
            const file = $('file').files[0]; if (!file) return;
            try { img = await cardPhoto(file); showPhoto(); } catch (err) { alert(err.message); }
            $('file').value = '';
          });
          const sync = () => { f.classList.toggle('is-totp', $('type').value === 'totp'); f.classList.toggle('is-app', $('type').value === 'app'); };
          sync();
          $('type').addEventListener('change', sync);
          let stream = null;
          const stopCam = () => { stream && stream.getTracks().forEach(t => t.stop()); stream = null; const cam = f.querySelector('.cam'); if (cam) cam.innerHTML = ''; };
          const close = () => { stopCam(); f.remove(); };
          f.addEventListener('click', async e => {
            if (e.target === f) return close();
            const sw = e.target.closest('.sw');
            if (sw) { f.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); sw.classList.add('on'); $('color').value = sw.dataset.col; return; }
            const act = e.target.closest('[data-act]')?.dataset.act;
            if (act === 'cancel') return close();
            if (act === 'zappka') { e.preventDefault(); $('app').value = 'pl.zabka.apb2c'; if (!$('name').value.trim()) $('name').value = 'Żabka'; return; }
            if (act === 'nophoto') { e.preventDefault(); img = ''; showPhoto(); return; }
            if (act === 'scan') {
              e.preventDefault();
              if (stream) return stopCam();
              try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const v = document.createElement('video'); v.setAttribute('playsinline', ''); v.muted = true; v.srcObject = stream;
                f.querySelector('.cam').appendChild(v); await v.play();
                const det = new BarcodeDetector();
                const map = { ean_13: 'ean13', ean_8: 'ean8', code_128: 'code128', qr_code: 'qr' };
                const tick = async () => {
                  if (!stream) return;
                  try {
                    const r = await det.detect(v);
                    if (r.length) { $('code').value = r[0].rawValue; $('type').value = map[r[0].format] || 'code128'; sync(); stopCam(); return; }
                  } catch (err) {}
                  setTimeout(tick, 250);
                };
                tick();
              } catch (err) { alert('Nie udało się włączyć aparatu: ' + (err.message || err)); stopCam(); }
              return;
            }
            if (act === 'del') {
              if (!confirm(`Usunąć kartę „${c.name}”?`)) return;
              cards.splice(idx, 1); await save(cards); close(); draw(); return;
            }
            if (act === 'save') {
              const n = { name: $('name').value.trim(), type: $('type').value, color: $('color').value, code: $('code').value.trim(),
                note: $('note').value.trim(), domain: $('domain').value.trim().replace(/^https?:\/\//, '').split('/')[0], nologo: !$('uselogo').checked, app: $('app').value.trim(), totp: { secret: $('secret').value.trim(), period: +$('period').value || 120, digits: +$('digits').value || 6,
                  template: $('template').value || '{kod}', fmt: $('fmt').value } };
              if (!n.name) return alert('Podaj nazwę sklepu.');
              if (n.type === 'app') { if (!/^[a-zA-Z][\w]*(\.[a-zA-Z][\w]*)+$/.test(n.app)) return alert('Podaj nazwę pakietu aplikacji, np. pl.zabka.apb2c'); }
              else if (n.type === 'totp') { try { KT.totp(n.totp.secret, n.totp.period, n.totp.digits); } catch (err) { return alert(err.message); } }
              else if (!n.code) return alert('Podaj numer karty albo zeskanuj kod.');
              if (n.type !== 'totp') delete n.totp;
              if (n.type !== 'app') delete n.app; else delete n.code;
              if (img) n.img = img;
              if (!n.note) delete n.note;
              if (!n.domain) delete n.domain;
              if (!n.nologo) delete n.nologo;
              if (idx == null) cards.push(n); else cards[idx] = n;
              e.target.textContent = 'Zapisuję…';
              try {
                await save(cards); close(); draw();
                if (!n.nologo && !n.img && !logoOf(n)) hass.callService('homeassistant', 'update_entity', { entity_id: 'sensor.karty_loga' }).catch(() => {});
              } catch (err) { alert('Błąd zapisu: ' + (err.message || err)); }
            }
          });
        };

        // Dotyk: akcje HA w button-card robią preventDefault() na touchend, więc na telefonie "click" w środku karty nie przychodzi.
        // pointerup przychodzi zawsze – reagujemy na nie (z progiem ruchu, żeby przewijanie nie otwierało karty) + click dla myszy/klawiatury.
        const onTap = (el, fn) => {
          let x = 0, y = 0, down = false, last = 0;
          el.addEventListener('pointerdown', e => { down = true; x = e.clientX; y = e.clientY; });
          el.addEventListener('pointercancel', () => { down = false; });
          el.addEventListener('pointerup', e => {
            if (!down) return; down = false;
            if (Math.hypot(e.clientX - x, e.clientY - y) > 12) return;
            last = Date.now(); e.stopPropagation(); fn(e);
          });
          el.addEventListener('click', e => { e.stopPropagation(); if (Date.now() - last > 600) fn(e); });
        };
        const draw = async () => {
          const el = root && root.getElementById(uid);
          if (!el) return;
          const cards = await load();
          // Z integracją karty każdy może dodawać i edytować; bez niej zapis wymaga admina.
          const adm = shared || !!(hass.user && hass.user.is_admin);
          el.innerHTML = `<div class="hd"><div class="tt">Karty lojalnościowe</div>${adm ? '<button class="add">+ Dodaj kartę</button>' : ''}</div>
            ${cards.length ? '' : adm ? '<div class="empty">Nie ma jeszcze żadnej karty. Dodaj pierwszą – możesz wpisać numer albo zeskanować kod aparatem.</div>' : '<div class="empty">Nie ma jeszcze żadnej karty.</div>'}
            <div class="grid">${cards.map((c, i) => [c, i]).sort((a, b) => a[0].name.localeCompare(b[0].name, 'pl', { sensitivity: 'base', numeric: true }))
              .map(([c, i]) => `<div class="tile ${c.img ? 'ph' : logoOf(c) ? 'lg' : ''}" data-i="${i}" style="${c.img ? `background:#ddd url('${c.img}') center/cover;color:#fff`
                  : logoOf(c) ? `background:#fff;color:#fff;--kc:${esc(c.color)}` : `background:${esc(c.color)};color:${textOn(c.color)}`}">
                ${!c.img && logoOf(c) ? `<img class="logo" src="${logoOf(c)}" alt="" loading="lazy">` : ''}
                <div class="nm">${esc(splitName(c.name)[0])}</div>
                <div class="ty">${splitName(c.name)[1] ? `<b>${esc(splitName(c.name)[1])}</b>` : c.type === 'app' ? 'Otwiera aplikację' : c.type === 'totp' ? `Kod dynamiczny · co ${Math.round((c.totp?.period || 120) / 60 * 10) / 10} min` : TYPES[c.type] || ''}</div>
                ${c.note ? '<div class="nt" title="Ma komentarz">💬</div>' : ''}
                ${adm ? `<button class="ed" data-e="${i}" title="Edytuj">✎</button>` : ''}</div>`).join('')}</div>`;
          if (adm) onTap(el.querySelector('.add'), () => openForm(cards, null));
          el.querySelectorAll('.tile').forEach(t => onTap(t, e => {
            const ed = e.target.closest && e.target.closest('.ed');
            if (ed) return openForm(cards, +ed.dataset.e);
            const c = cards[+t.dataset.i];
            if (c.type === 'app') return openApp(c);
            openFull(c);
          }));
        };
        setTimeout(draw, 0);
        libs().catch(() => {});
        return `<style>
        .hd { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .tt { flex: 1; font-size: 22px; font-weight: 500; }
        .add { border: 0; border-radius: 20px; padding: 10px 18px; font-size: 15px; font-weight: 500; cursor: pointer;
          background: var(--primary-color); color: var(--text-primary-color, #fff); }
        .empty { color: var(--secondary-text-color); padding: 24px 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(28vw, 150px), 1fr)); gap: 10px; }
        .tile, .add { touch-action: manipulation; }
        .tile { position: relative; aspect-ratio: 1.586; border-radius: 10px; padding: 8px 10px; box-sizing: border-box; cursor: pointer;
          display: flex; flex-direction: column; justify-content: flex-end; box-shadow: 0 2px 8px rgba(0,0,0,.18); text-align: left;
          -webkit-tap-highlight-color: transparent; transition: transform .1s; }
        .tile:active { transform: scale(.97); }
        .tile .nm { font-size: 14px; font-weight: 700; white-space: nowrap; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; }
        .tile .ty b { font-weight: 700; opacity: 1; }
        .tile .ty { font-size: 10px; opacity: .85; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tile.lg { padding: 0; overflow: hidden; justify-content: flex-end; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
        .tile.lg .logo { position: absolute; left: 10%; right: 10%; top: 8%; bottom: 34%; width: 80%; height: 58%; object-fit: contain; }
        .tile.lg .nm, .tile.lg .ty { background: var(--kc); padding: 0 8px; margin: 0; }
        .tile.lg .nm { font-size: 12px; padding-top: 3px; } .tile.lg .ty { font-size: 9px; padding-bottom: 3px; }
        .tile.ph { justify-content: flex-end; padding: 0; overflow: hidden; }
        .tile.ph .nm, .tile.ph .ty { background: rgba(0,0,0,.55); padding: 0 12px; margin: 0; }
        .tile.ph .nm { font-size: 12px; padding-top: 3px; }
        .tile.ph .ty { padding-bottom: 3px; font-size: 9px; }
        .tile .nt { position: absolute; top: 5px; left: 6px; font-size: 12px; z-index: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
        .tile .ed { position: absolute; top: 3px; right: 3px; width: 28px; height: 28px; z-index: 1; border-radius: 50%; border: 0; cursor: pointer;
          background: rgba(0,0,0,.15); color: inherit; font-size: 16px; }
        </style><div id="${uid}" style="text-align:left"><div style="color:var(--secondary-text-color)">Wczytywanie kart…</div></div>`;

        ]]]
